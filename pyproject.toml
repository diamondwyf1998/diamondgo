[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diamondgo"
version = "0.1.0"
description = "Learning-oriented AlphaZero/KataGo-style Go AI experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "tqdm>=4.66",
    "sgfmill>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
