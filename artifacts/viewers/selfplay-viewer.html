<!doctype html>
<meta charset="utf-8">
<title>DiamondGo self-play viewer</title>
<style>
  :root { color: #172026; background: #f6f4ed; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  body { margin: 0; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 20px; border-bottom: 1px solid #d7d2c5; background: #fbfaf6; }
  h1 { font-size: 20px; margin: 0 12px 0 0; }
  label { font-size: 13px; color: #52606d; display: grid; gap: 4px; }
  select, button, input, textarea { border: 1px solid #bcc7c1; border-radius: 6px; background: #fff; padding: 0 10px; color: #172026; }
  select, button, input { height: 34px; }
  textarea { min-height: 76px; padding: 8px 10px; resize: vertical; font: inherit; }
  button { cursor: pointer; font-weight: 650; }
  input[type="range"] { width: min(520px, 72vw); accent-color: #0b7285; }
  main { display: grid; grid-template-columns: minmax(300px, 520px) minmax(280px, 1fr); gap: 20px; padding: 20px; }
  .board-wrap { width: min(82vw, 520px); min-width: 0; }
  canvas { width: 100%; aspect-ratio: 1; background: #d8a84f; border: 1px solid #7f5539; display: block; }
  .panel { background: #fff; border: 1px solid #d7dce2; border-radius: 8px; padding: 14px; min-width: 0; overflow-wrap: anywhere; }
  .toolbar, .scrubber { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .scrubber span { min-width: 78px; font-variant-numeric: tabular-nums; color: #52606d; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .stat { border: 1px solid #e4e7eb; border-radius: 6px; padding: 8px; background: #fbfaf6; }
  .stat b { display: block; font-size: 12px; color: #627d98; margin-bottom: 3px; }
  ol { margin: 8px 0 0; padding-left: 22px; }
  li { margin: 7px 0; }
  .move-list { max-height: 260px; overflow: auto; border-top: 1px solid #e4e7eb; margin-top: 12px; padding-top: 8px; font-size: 13px; line-height: 1.8; }
  .current { color: #0b7285; font-weight: 750; }
  #status { min-height: 22px; color: #52606d; font-size: 13px; }
  #status.error { color: #9f1239; font-weight: 700; }
  #status.ok { color: #166534; font-weight: 700; }
  .modal-backdrop[hidden] { display: none; }
  .modal-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(23, 32, 38, 0.48); z-index: 10; }
  .modal-card { width: min(520px, 100%); background: #fbfaf6; border: 1px solid #d7d2c5; border-radius: 8px; padding: 18px; box-shadow: 0 18px 48px rgba(23, 32, 38, 0.24); }
  .modal-card h2 { margin: 0 0 14px; font-size: 18px; }
  .modal-grid { display: grid; gap: 12px; }
  .modal-grid label { color: #172026; }
  .modal-grid input, .modal-grid select, .modal-grid textarea { width: 100%; box-sizing: border-box; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .secondary { background: #f8fafc; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
</style>
<header>
  <h1>DiamondGo self-play viewer</h1>
  <label>Dataset <input id="dataset" size="44" value="selfplay-catalog-fresh-nokomi-selected-20260606"></label>
  <label>Checkpoint <select id="cycle">
    <option value="20">cycle-00020 | score2p5 100sims</option>
    <option value="40">cycle-00040 | score2p5 100sims</option>
    <option value="60">cycle-00060 | score2p5 100sims</option>
    <option value="80">cycle-00080 | score2p5 200sims</option>
    <option value="100">cycle-00100 | score2p5 200sims</option>
    <option value="150">cycle-00150 | score2p5 200sims</option>
    <option value="200">cycle-00200 | score2p5 200sims</option>
    <option value="250">cycle-00250 | score2p5 200sims</option>
    <option value="300">cycle-00300 | score2p5 200sims</option>
    <option value="350">cycle-00350 | score2p5 200sims</option>
    <option value="400">cycle-00400 | score2p5 200sims</option>
    <option value="430">cycle-00430 | score4p5 200sims</option>
    <option value="435" selected>cycle-00435 | score4p5 200sims latest</option>
  </select></label>
  <label>Game <select id="game">
    <option value="1" selected>Game 1</option>
    <option value="2">Game 2</option>
  </select></label>
  <label>Move <select id="move"></select></label>
  <button id="load">Load</button>
  <button id="latestDataset">Latest dataset</button>
</header>
<main>
  <section class="board-wrap">
    <canvas id="board" width="900" height="900"></canvas>
    <div class="scrubber"><input id="scrubber" type="range" min="0" max="0" value="0"><span id="scrubText">0 / 0</span></div>
    <div class="toolbar"><button id="first">|&lt;</button><button id="prev">&lt;</button><button id="next">&gt;</button><button id="last">&gt;|</button><button id="savePuzzle">Save as puzzle</button><button id="openPuzzleAuthor">Open author</button></div>
  </section>
  <aside class="panel">
    <div class="stat-grid">
      <div class="stat"><b>Current</b><span id="current">-</span></div>
      <div class="stat"><b>Root value</b><span id="root">-</span></div>
      <div class="stat"><b>Result</b><span id="summary">-</span></div>
      <div class="stat"><b>Captures</b><span id="captures">-</span></div>
    </div>
    <label>Puzzle name <input id="puzzleName" placeholder="Optional name before saving"></label>
    <h3>Top 3 candidates</h3>
    <ol id="top"></ol>
    <div id="status"></div>
    <div class="move-list" id="moves"></div>
  </aside>
</main>
<div id="puzzleModal" class="modal-backdrop" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="puzzleModalTitle">
    <h2 id="puzzleModalTitle">Save puzzle</h2>
    <div class="modal-grid">
      <label>Name <input id="modalPuzzleName"></label>
      <label>Category
        <select id="modalPuzzleCategory">
          <option value="selfplay_snapshot">selfplay_snapshot</option>
          <option value="capture">capture</option>
          <option value="atari">atari</option>
          <option value="defense">defense</option>
          <option value="eye_shape">eye_shape</option>
          <option value="terminal_cleanup">terminal_cleanup</option>
          <option value="other">other</option>
        </select>
      </label>
      <label>Subcategory <input id="modalPuzzleSubcategory"></label>
      <label>Good answers <textarea id="modalPuzzleGood" placeholder="Example: E5, D4"></textarea></label>
      <label>Bad answers <textarea id="modalPuzzleBad" placeholder="Example: A1 J9"></textarea></label>
      <label>Note <textarea id="modalPuzzleNote"></textarea></label>
    </div>
    <div class="modal-actions">
      <button type="button" id="cancelPuzzleSave" class="secondary">Cancel</button>
      <button type="button" id="confirmPuzzleSave">Save to draft</button>
    </div>
  </div>
</div>
<script>
window.addEventListener("error", event => {
  const status = document.querySelector("#status");
  if (status) status.textContent = `Viewer script error: ${event.message}`;
});
const boardSize = 9;
const defaultDataset = "selfplay-catalog-fresh-nokomi-selected-20260606";
const puzzleStorageKey = "diamondgo-puzzle-author-v1";
const params = new URLSearchParams(location.search);
let initialCycleParam = params.get("cycle");
let initialGameParam = params.get("game");
let initialMoveParam = params.get("move");
const datasetInput = document.querySelector("#dataset");
const cycleSelect = document.querySelector("#cycle");
const gameSelect = document.querySelector("#game");
const moveSelect = document.querySelector("#move");
const scrubber = document.querySelector("#scrubber");
const scrubText = document.querySelector("#scrubText");
const canvas = document.querySelector("#board");
const puzzleNameInput = document.querySelector("#puzzleName");
const puzzleModal = document.querySelector("#puzzleModal");
const modalPuzzleName = document.querySelector("#modalPuzzleName");
const modalPuzzleCategory = document.querySelector("#modalPuzzleCategory");
const modalPuzzleSubcategory = document.querySelector("#modalPuzzleSubcategory");
const modalPuzzleGood = document.querySelector("#modalPuzzleGood");
const modalPuzzleBad = document.querySelector("#modalPuzzleBad");
const modalPuzzleNote = document.querySelector("#modalPuzzleNote");
const confirmPuzzleSaveButton = document.querySelector("#confirmPuzzleSave");
const cancelPuzzleSaveButton = document.querySelector("#cancelPuzzleSave");
let ctx = null;
let summary = [];
let trace = null;
let gameMoves = [];
let step = 0;
let pendingPuzzleCase = null;
datasetInput.value = params.get("dataset") || datasetInput.value || defaultDataset;

function getBoardContext() {
  if (ctx) return ctx;
  if (!canvas || typeof canvas.getContext !== "function") return null;
  ctx = canvas.getContext("2d");
  return ctx;
}

function dataUrl(path) {
  return `../${datasetInput.value.replace(/^\.\.\//, "")}/${path}`;
}

function updateUrl() {
  const next = new URLSearchParams();
  next.set("dataset", datasetInput.value);
  if (cycleSelect.value) next.set("cycle", cycleSelect.value);
  if (gameSelect.value) next.set("game", gameSelect.value);
  if (step > 0) next.set("move", String(step));
  history.replaceState(null, "", `${location.pathname}?${next.toString()}`);
}

function setStatus(message, kind = "") {
  const status = document.querySelector("#status");
  status.textContent = message;
  status.className = kind;
}

function actionPoint(action) {
  if (action >= boardSize * boardSize) return null;
  return { row: Math.floor(action / boardSize), col: action % boardSize };
}

function gtpFromAction(action) {
  const p = actionPoint(action);
  if (!p) return "pass";
  return `${"ABCDEFGHJ"[p.col]}${boardSize - p.row}`;
}

function colorAfterStep() {
  if (step < gameMoves.length && gameMoves[step]?.player) return gameMoves[step].player;
  if (step > 0 && gameMoves[step - 1]?.player) {
    return gameMoves[step - 1].player === "b" ? "w" : "b";
  }
  return "b";
}

function pointToGtp(point) {
  return `${"ABCDEFGHJ"[point[1]]}${boardSize - point[0]}`;
}

function formatPointList(points) {
  return (points || []).map(pointToGtp).join(", ");
}

function parsePointList(text) {
  const trimmed = text.trim().toUpperCase();
  if (!trimmed) return [];
  const points = [];
  const seen = new Set();
  const tokens = trimmed.split(/[\s,;]+/).filter(Boolean);
  for (const token of tokens) {
    const match = token.match(/^([A-HJ])([1-9])$/);
    if (!match) throw new Error(`Bad point "${token}". Use coordinates like E5 or D4.`);
    const col = "ABCDEFGHJ".indexOf(match[1]);
    const row = boardSize - Number(match[2]);
    if (row < 0 || row >= boardSize || col < 0 || col >= boardSize) {
      throw new Error(`Point "${token}" is outside the ${boardSize}x${boardSize} board.`);
    }
    const key = `${row},${col}`;
    if (!seen.has(key)) {
      seen.add(key);
      points.push([row, col]);
    }
  }
  return points.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}

function terminalCleanupEnabled() {
  return Boolean(trace?.config?.terminal_dead_stone_cleanup);
}

function neighbors(row, col) {
  return [[row - 1, col], [row + 1, col], [row, col - 1], [row, col + 1]].filter(([r, c]) => r >= 0 && r < boardSize && c >= 0 && c < boardSize);
}

function groupAt(board, row, col) {
  const color = board[row][col];
  const stones = [];
  const seen = new Set([`${row},${col}`]);
  const stack = [[row, col]];
  let liberties = 0;
  while (stack.length) {
    const [r, c] = stack.pop();
    stones.push([r, c]);
    for (const [nr, nc] of neighbors(r, c)) {
      const v = board[nr][nc];
      if (!v) liberties += 1;
      else if (v === color && !seen.has(`${nr},${nc}`)) {
        seen.add(`${nr},${nc}`);
        stack.push([nr, nc]);
      }
    }
  }
  return { stones, liberties };
}

function positionAt(count) {
  const board = Array.from({ length: boardSize }, () => Array(boardSize).fill(""));
  let blackCaptures = 0, whiteCaptures = 0;
  for (const move of gameMoves.slice(0, count)) {
    const p = actionPoint(Number(move.chosen_action));
    if (!p) continue;
    const color = move.player;
    const enemy = color === "b" ? "w" : "b";
    board[p.row][p.col] = color;
    for (const [nr, nc] of neighbors(p.row, p.col)) {
      if (board[nr][nc] !== enemy) continue;
      const group = groupAt(board, nr, nc);
      if (group.liberties === 0) {
        for (const [sr, sc] of group.stones) board[sr][sc] = "";
        if (color === "b") blackCaptures += group.stones.length;
        else whiteCaptures += group.stones.length;
      }
    }
  }
  const cleanupCounts = terminalCleanupEnabled() && count >= gameMoves.length ? applyTerminalCleanup(board) : { b: 0, w: 0 };
  return { board, blackCaptures, whiteCaptures, cleanupCounts };
}

function stoneGroups(board) {
  const groups = [];
  const visited = new Set();
  for (let row = 0; row < boardSize; row++) {
    for (let col = 0; col < boardSize; col++) {
      const color = board[row][col];
      const key = `${row},${col}`;
      if (!color || visited.has(key)) continue;
      const stack = [[row, col]];
      const stones = [];
      visited.add(key);
      while (stack.length) {
        const [r, c] = stack.pop();
        stones.push([r, c]);
        for (const [nr, nc] of neighbors(r, c)) {
          const nextKey = `${nr},${nc}`;
          if (board[nr][nc] === color && !visited.has(nextKey)) {
            visited.add(nextKey);
            stack.push([nr, nc]);
          }
        }
      }
      groups.push({ color, stones });
    }
  }
  return groups;
}

function emptyRegion(board, seeds) {
  const region = [];
  const borders = new Set();
  const seen = new Set();
  const stack = seeds.filter(([row, col]) => !board[row][col]);
  for (const [row, col] of stack) seen.add(`${row},${col}`);
  while (stack.length) {
    const [row, col] = stack.pop();
    region.push([row, col]);
    for (const [nr, nc] of neighbors(row, col)) {
      const color = board[nr][nc];
      if (color) {
        borders.add(color);
        continue;
      }
      const key = `${nr},${nc}`;
      if (!seen.has(key)) {
        seen.add(key);
        stack.push([nr, nc]);
      }
    }
  }
  return { region, borders };
}

function regionTouchesEdge(region) {
  return region.some(([row, col]) => row === 0 || col === 0 || row === boardSize - 1 || col === boardSize - 1);
}

function solidEyeCount(board, stones, color) {
  const seenRegions = new Set();
  let eyes = 0;
  for (const [row, col] of stones) {
    for (const [nr, nc] of neighbors(row, col)) {
      if (board[nr][nc]) continue;
      const { region, borders } = emptyRegion(board, [[nr, nc]]);
      const key = region.map(([r, c]) => `${r},${c}`).sort().join("|");
      if (seenRegions.has(key)) continue;
      seenRegions.add(key);
      if (borders.size === 1 && borders.has(color)) eyes += 1;
    }
  }
  return eyes;
}

function applyTerminalCleanup(board) {
  const dead = [];
  for (const { color, stones } of stoneGroups(board)) {
    if (solidEyeCount(board, stones, color) >= 2) continue;
    const removed = board.map(row => row.slice());
    for (const [row, col] of stones) removed[row][col] = "";
    const { region, borders } = emptyRegion(removed, stones);
    const opponent = color === "b" ? "w" : "b";
    if (region.length && !regionTouchesEdge(region) && borders.size === 1 && borders.has(opponent)) {
      dead.push({ color, stones });
    }
  }
  const counts = { b: 0, w: 0 };
  for (const { color, stones } of dead) {
    for (const [row, col] of stones) board[row][col] = "";
    counts[color] += stones.length;
  }
  return counts;
}

function boardPointsFor(pos, color) {
  const points = [];
  for (let row = 0; row < boardSize; row++) {
    for (let col = 0; col < boardSize; col++) {
      if (pos.board[row][col] === color) points.push([row, col]);
    }
  }
  return points;
}

function actionToPointArray(action) {
  const point = actionPoint(Number(action));
  return point ? [point.row, point.col] : null;
}

function loadPuzzleDraft() {
  try {
    const saved = JSON.parse(localStorage.getItem(puzzleStorageKey) || "null");
    if (saved && Array.isArray(saved.cases)) {
      return { version: 1, board_size: boardSize, cases: saved.cases };
    }
  } catch (_err) {
    // Fall through to a fresh draft.
  }
  return { version: 1, board_size: boardSize, cases: [] };
}

function isEmptyPuzzleCase(item) {
  return item
    && !item.black?.length
    && !item.white?.length
    && !item.good?.length
    && !item.bad?.length
    && !item.note;
}

function buildCurrentPuzzleCase() {
  if (!gameMoves.length) {
    setStatus("No self-play game is loaded yet.", "error");
    return null;
  }
  const pos = positionAt(step);
  const cycleLabel = `cycle-${String(cycleSelect.value || "0").padStart(5, "0")}`;
  const gameLabel = `game-${String(gameSelect.value || "1").padStart(2, "0")}`;
  const moveLabel = `move-${String(step).padStart(3, "0")}`;
  const autoName = `${cycleLabel}_${gameLabel}_${moveLabel}`;
  const customName = puzzleNameInput.value.trim();
  const cleanupNote = pos.cleanupCounts.b || pos.cleanupCounts.w
    ? ` Terminal cleanup removed B ${pos.cleanupCounts.b} / W ${pos.cleanupCounts.w} stones.`
    : "";
  const puzzleCase = {
    name: customName || autoName,
    category: "selfplay_snapshot",
    subcategory: cycleLabel,
    to_play: colorAfterStep(),
    black: boardPointsFor(pos, "b"),
    white: boardPointsFor(pos, "w"),
    good: [],
    bad: [],
    note: `Source ${datasetInput.value}, ${cycleLabel}, ${gameLabel}, after ${step} moves.${cleanupNote}`
  };
  return puzzleCase;
}

function openPuzzleModal() {
  pendingPuzzleCase = buildCurrentPuzzleCase();
  if (!pendingPuzzleCase) return;
  modalPuzzleName.value = pendingPuzzleCase.name;
  modalPuzzleCategory.value = pendingPuzzleCase.category;
  modalPuzzleSubcategory.value = pendingPuzzleCase.subcategory;
  modalPuzzleGood.value = formatPointList(pendingPuzzleCase.good);
  modalPuzzleBad.value = formatPointList(pendingPuzzleCase.bad);
  modalPuzzleNote.value = pendingPuzzleCase.note;
  puzzleModal.hidden = false;
  modalPuzzleName.focus();
  modalPuzzleName.select();
}

function closePuzzleModal() {
  puzzleModal.hidden = true;
  pendingPuzzleCase = null;
}

function savePendingPuzzle() {
  if (!pendingPuzzleCase) return;
  let good;
  let bad;
  try {
    good = parsePointList(modalPuzzleGood.value);
    bad = parsePointList(modalPuzzleBad.value);
  } catch (err) {
    setStatus(err.message, "error");
    return;
  }
  const puzzleCase = {
    ...pendingPuzzleCase,
    name: modalPuzzleName.value.trim() || pendingPuzzleCase.name,
    category: modalPuzzleCategory.value || pendingPuzzleCase.category,
    subcategory: modalPuzzleSubcategory.value.trim() || pendingPuzzleCase.subcategory,
    good,
    bad,
    note: modalPuzzleNote.value.trim() || pendingPuzzleCase.note
  };
  const draft = loadPuzzleDraft();
  if (draft.cases.length === 1 && isEmptyPuzzleCase(draft.cases[0])) draft.cases[0] = puzzleCase;
  else draft.cases.push(puzzleCase);
  localStorage.setItem(puzzleStorageKey, JSON.stringify(draft));
  closePuzzleModal();
  setStatus(`Saved "${puzzleCase.name}" to puzzle draft (${puzzleCase.category} / ${puzzleCase.subcategory}); answer left empty.`, "ok");
}

function draw() {
  const ctx = getBoardContext();
  const pos = positionAt(step);
  if (!ctx) {
    updateText(pos);
    setStatus("Canvas is unavailable in this browser view; move data is loaded below.", "error");
    return;
  }
  const size = canvas.width, margin = 58, gap = (size - margin * 2) / (boardSize - 1);
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = "#d9ab55"; ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = "#3f2d20"; ctx.lineWidth = 3;
  for (let i = 0; i < boardSize; i++) {
    const x = margin + i * gap, y = margin + i * gap;
    ctx.beginPath(); ctx.moveTo(margin, y); ctx.lineTo(size - margin, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, margin); ctx.lineTo(x, size - margin); ctx.stroke();
  }
  ctx.fillStyle = "#3f2d20";
  ctx.font = "24px system-ui, -apple-system, Segoe UI, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (let i = 0; i < boardSize; i++) {
    const x = margin + i * gap, y = margin + i * gap;
    const file = "ABCDEFGHJ"[i];
    const rank = String(boardSize - i);
    ctx.fillText(file, x, margin - 30);
    ctx.fillText(file, x, size - margin + 30);
    ctx.fillText(rank, margin - 30, y);
    ctx.fillText(rank, size - margin + 30, y);
  }
  ctx.fillStyle = "#3f2d20";
  for (const [r, c] of [[2,2],[2,6],[4,4],[6,2],[6,6]]) {
    ctx.beginPath(); ctx.arc(margin + c * gap, margin + r * gap, 7, 0, Math.PI * 2); ctx.fill();
  }
  for (let r = 0; r < boardSize; r++) for (let c = 0; c < boardSize; c++) {
    const stone = pos.board[r][c];
    if (!stone) continue;
    const x = margin + c * gap, y = margin + r * gap;
    ctx.beginPath(); ctx.arc(x, y, gap * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = stone === "b" ? "#111" : "#f8fafc"; ctx.fill();
    ctx.strokeStyle = stone === "b" ? "#000" : "#64748b"; ctx.lineWidth = 2; ctx.stroke();
  }
  if (step > 0) {
    const p = actionPoint(Number(gameMoves[step - 1].chosen_action));
    if (p) {
      ctx.strokeStyle = "#d7263d"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(margin + p.col * gap, margin + p.row * gap, gap * 0.5, 0, Math.PI * 2); ctx.stroke();
    }
  }
  updateText(pos);
}

function updateText(pos) {
  const move = gameMoves[Math.max(0, step - 1)];
  document.querySelector("#current").textContent = step === 0 ? "Start" : `${step}/${gameMoves.length} ${move.player.toUpperCase()} ${move.chosen_move || gtpFromAction(Number(move.chosen_action))}`;
  document.querySelector("#root").textContent = step === 0 ? "-" : Number(move.root_value || 0).toFixed(4);
  const first = gameMoves[0];
  const winner = Number(first?.value_target || 0) > 0 ? "B win" : "W win";
  document.querySelector("#summary").textContent = gameMoves.length ? `${winner}, ${gameMoves.length} moves` : "-";
  const cleanupText = pos.cleanupCounts.b || pos.cleanupCounts.w ? `, cleanup B ${pos.cleanupCounts.b} / W ${pos.cleanupCounts.w}` : "";
  document.querySelector("#captures").textContent = `B ${pos.blackCaptures} / W ${pos.whiteCaptures}${cleanupText}`;
  const actions = step === 0 ? gameMoves[0]?.top_actions || [] : move.top_actions || [];
  document.querySelector("#top").innerHTML = actions.slice(0, 3).map(item => `<li>${item.move} visits=${item.visits} prior=${item.prior} value=${item.value}</li>`).join("");
  document.querySelector("#moves").innerHTML = gameMoves.map((m, i) => `<span class="${i + 1 === step ? "current" : ""}">${i + 1}. ${m.player.toUpperCase()} ${m.chosen_move || gtpFromAction(Number(m.chosen_action))}</span>`).join(" &nbsp; ");
}

function setStep(nextStep) {
  step = Math.max(0, Math.min(gameMoves.length, nextStep));
  moveSelect.value = String(step);
  scrubber.value = String(step);
  scrubText.textContent = `${step} / ${gameMoves.length}`;
  draw();
}

async function loadDataset() {
  setStatus("");
  try {
    summary = await fetch(dataUrl("summary.json"), { cache: "no-store" }).then(r => {
      if (!r.ok) throw new Error(`summary.json ${r.status}`);
      return r.json();
    });
    if (!Array.isArray(summary) || !summary.length) {
      throw new Error(`summary.json has no checkpoint entries for ${datasetInput.value}`);
    }
    cycleSelect.innerHTML = "";
    for (const item of summary) {
      const option = document.createElement("option");
      option.value = String(item.cycle);
      option.textContent = item.label || `cycle-${String(item.cycle).padStart(5, "0")}`;
      cycleSelect.append(option);
    }
    if (initialCycleParam && [...cycleSelect.options].some(option => option.value === initialCycleParam)) {
      cycleSelect.value = initialCycleParam;
    }
    await loadCycle();
    initialCycleParam = null;
    initialGameParam = null;
  } catch (err) {
    setStatus(`Could not load dataset: ${err.message}`, "error");
  }
}

async function loadCycle() {
  setStatus("");
  const traceFile = `cycle-${String(cycleSelect.value).padStart(5, "0")}-moves.json`;
  trace = await fetch(dataUrl(traceFile), { cache: "no-store" }).then(r => {
    if (!r.ok) throw new Error(`${traceFile} ${r.status}`);
    return r.json();
  });
  if (!trace || !Array.isArray(trace.moves) || !trace.moves.length) {
    throw new Error(`${traceFile} has no moves`);
  }
  const games = [...new Set(trace.moves.map(m => Number(m.game)).filter(Number.isFinite))].sort((a, b) => a - b);
  const selectedGame = gameSelect.value || initialGameParam || "1";
  gameSelect.innerHTML = "";
  for (const game of games.length ? games : [1, 2]) {
    const option = document.createElement("option");
    option.value = String(game);
    option.textContent = `Game ${game}`;
    gameSelect.append(option);
  }
  if (initialGameParam && [...gameSelect.options].some(option => option.value === initialGameParam)) {
    gameSelect.value = initialGameParam;
  } else if ([...gameSelect.options].some(option => option.value === selectedGame)) {
    gameSelect.value = selectedGame;
  }
  loadGame();
  updateUrl();
}

function loadGame() {
  if (!trace || !Array.isArray(trace.moves)) {
    setStatus("Trace is not loaded yet", "error");
    return;
  }
  const game = Number(gameSelect.value);
  gameMoves = trace.moves.filter(m => Number(m.game) === game).sort((a, b) => Number(a.move_in_game) - Number(b.move_in_game));
  if (!gameMoves.length) {
    setStatus(`No moves found for Game ${game}`, "error");
    return;
  }
  moveSelect.innerHTML = "";
  scrubber.min = "0"; scrubber.max = String(gameMoves.length);
  for (let i = 0; i <= gameMoves.length; i++) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = i === 0 ? "Start" : `${i}. ${gameMoves[i - 1].player.toUpperCase()} ${gameMoves[i - 1].chosen_move || gtpFromAction(Number(gameMoves[i - 1].chosen_action))}`;
    moveSelect.append(option);
  }
  const requestedStep = initialMoveParam === null ? 0 : Number(initialMoveParam);
  setStep(Number.isFinite(requestedStep) ? requestedStep : 0);
  initialMoveParam = null;
  updateUrl();
}

document.querySelector("#load").addEventListener("click", loadDataset);
document.querySelector("#latestDataset").addEventListener("click", () => {
  datasetInput.value = defaultDataset;
  initialCycleParam = null;
  initialGameParam = null;
  loadDataset();
});
cycleSelect.addEventListener("change", () => {
  initialGameParam = null;
  loadCycle().catch(err => {
    setStatus(`Could not load checkpoint: ${err.message}`, "error");
  });
});
gameSelect.addEventListener("change", loadGame);
moveSelect.addEventListener("change", () => setStep(Number(moveSelect.value)));
scrubber.addEventListener("input", () => setStep(Number(scrubber.value)));
document.querySelector("#first").addEventListener("click", () => setStep(0));
document.querySelector("#prev").addEventListener("click", () => setStep(step - 1));
document.querySelector("#next").addEventListener("click", () => setStep(step + 1));
document.querySelector("#last").addEventListener("click", () => setStep(gameMoves.length));
document.querySelector("#savePuzzle").addEventListener("click", openPuzzleModal);
confirmPuzzleSaveButton.addEventListener("click", savePendingPuzzle);
cancelPuzzleSaveButton.addEventListener("click", closePuzzleModal);
puzzleModal.addEventListener("click", event => {
  if (event.target === puzzleModal) closePuzzleModal();
});
window.addEventListener("keydown", event => {
  if (event.key === "Escape" && !puzzleModal.hidden) closePuzzleModal();
});
document.querySelector("#openPuzzleAuthor").addEventListener("click", () => {
  location.href = "../viewers/puzzle-author.html";
});
function startViewer() {
  datasetInput.value = params.get("dataset") || datasetInput.value || defaultDataset;
  loadDataset();
}

if (document.readyState === "loading") {
  window.addEventListener("DOMContentLoaded", startViewer);
} else {
  startViewer();
}
</script>
